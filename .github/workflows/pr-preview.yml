name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Stage the browser demo
        if: github.event.action != 'closed'
        run: |
          mkdir -p _site
          cp -a software/web/demo/. _site/
          touch _site/.nojekyll
      - name: Stage an empty preview
        if: github.event.action == 'closed'
        run: mkdir -p _site && touch _site/.keep
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          target-folder: pr-preview/pr-${{ github.event.number }}
          force: false
          commit-message: ${{ github.event.action == 'closed' && format('Remove preview for PR {0}', github.event.number) || format('Deploy preview for PR {0}', github.event.number) }}
      - uses: marocchino/sticky-pull-request-comment@v3
        if: github.event.action != 'closed'
        with:
          header: pr-preview
          message: >
            Preview:
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
      - uses: marocchino/sticky-pull-request-comment@v3
        if: github.event.action == 'closed'
        with:
          header: pr-preview
          message: Preview removed.
