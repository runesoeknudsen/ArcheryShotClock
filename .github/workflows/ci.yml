# Replacement for .github/workflows/ci.yml once a token has the `workflow`
# scope. Clears the Node 20 deprecation warnings and uploads a top-level
# browser-demo artifact. Until then the existing workflow still uploads
# playwright-artifacts, which now always includes test-results/browser-demo.
name: Build and test

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Run native tests
        run: pio test -e native -d software/firmware
      - name: Check the trace conformance harness
        run: python software/tools/logcheck.py --selftest
      - name: Build ESP32 firmware
        run: pio run -e esp32dev -d software/firmware

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
      - name: Upload shareable browser demo
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: browser-demo
          path: software/web/demo/
          if-no-files-found: error
