[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 921600
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> -<browser/>
extra_scripts = pre:../tools/embed_web.py

[env:waveshare_s3_hub75]
platform = espressif32
board = esp32s3camlcd
framework = arduino
board_build.arduino.memory_type = opi_opi
board_build.partitions = partitions_s3.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.flash_size = 32MB
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 921600
upload_speed = 921600
lib_deps =
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#3.0.14
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DDISPLAY_HUB75=1
    -DNO_GFX=1
    -DBOARD_WAVESHARE_S3=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<browser/>
extra_scripts = pre:../tools/embed_web.py

[env:native]
platform = native
test_framework = unity
test_filter = test_*
test_build_src = yes
build_src_filter = +<core/*.cpp> +<browser/*.cpp>
extra_scripts = pre:../tools/embed_web.py
